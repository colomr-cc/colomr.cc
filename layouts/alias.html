<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "es" }}">
<head>
  <meta charset="utf-8">
  <title>colomr.cc</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <script>
    (function() {
      var STORAGE_KEY = 'colomr-lang';
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved === 'es' || saved === 'en') {
        window.location.replace('/' + saved + '/');
        return;
      }
      var langs = navigator.languages || [navigator.language || 'es'];
      for (var lang of langs) {
        var l = lang.toLowerCase();
        if (l.startsWith('en')) { window.location.replace('/en/'); return; }
        if (l.startsWith('es')) { break; }
      }
      window.location.replace('/es/');
    })();
  </script>
  <!-- Fallback para clientes sin JavaScript (incluidos los bots de previsualización de enlaces) -->
  <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
</head>
<body>
  <p>Redirigiendo… Si no ocurre automáticamente, <a href="{{ .Permalink }}">entra aquí</a>.</p>
</body>
</html>
