sonar.projectKey=maiwei-app_colomr.cc
sonar.organization=maiwei-app

# S8544 demands hash-verified pip installs (--require-hashes). This org pins
# dependencies by semantic version instead, the same policy lint-no-shas.yml
# enforces for actions, so the rule contradicts a deliberate decision.
# Mirrors maiwei-app/workflows.
sonar.issue.ignore.multicriteria=s8544
sonar.issue.ignore.multicriteria.s8544.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.s8544.resourceKey=.github/workflows/*
