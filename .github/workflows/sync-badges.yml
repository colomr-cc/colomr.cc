name: Sync Badges

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch: {} # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Own GitHub App token: expires in 1 hour and, unlike GITHUB_TOKEN,
      # it does trigger ci.yml and deploy.yml on the PR (the required checks).
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MAIBOT_APP_ID }}
          private-key: ${{ secrets.MAIBOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --only-binary ':all:' -r scripts/requirements.txt

      - name: Sync badges from Google Skills profile
        id: sync
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/sync_badges.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/badges.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Deployment no longer lives here: on merging the PR, deploy.yml publishes to production.
      # That way the repo never drifts out of sync with what is deployed.
      - name: Create branch and PR with the new badges
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_MSG: ${{ steps.sync.outputs.commit_msg }}
          BADGE_COUNT: ${{ steps.sync.outputs.badge_count }}
        run: |
          BRANCH="badges/sync-$(date -u +%Y%m%d-%H%M)"
          # Owner authorship: the automation is his tool, not a co-author
          git config user.name "F Colomer"
          git config user.email "colomr@pm.me"
          git checkout -b "$BRANCH"
          git add data/badges.json
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$COMMIT_MSG" \
            --reviewer colomr-cc \
            --body "Automatic sync from the Google Cloud Skills Boost profile ($BADGE_COUNT new badge(s)).

          Descriptions are generated by Gemini: review them in the Firebase preview before merging. On merge, deploy.yml publishes to production."
