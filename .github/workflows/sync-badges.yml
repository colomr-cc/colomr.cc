name: Sync Badges

on:
  schedule:
    - cron: '0 8 * * 1' # Cada lunes a las 8:00 UTC
  workflow_dispatch: {} # Trigger manual

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Token de la GitHub App propia: caduca en 1 hora y, a diferencia de GITHUB_TOKEN,
      # sí dispara ci.yml y deploy.yml sobre el PR (los checks obligatorios).
      - name: Acuñar token de la App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --only-binary ':all:' --require-hashes -r scripts/requirements.lock

      - name: Sync badges from Google Skills profile
        id: sync
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/sync_badges.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/badges.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # El despliegue ya no vive aquí: al mergear el PR, deploy.yml publica a producción.
      # Así el repo nunca queda desincronizado con lo desplegado.
      - name: Crear rama y PR con los badges nuevos
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_MSG: ${{ steps.sync.outputs.commit_msg }}
          BADGE_COUNT: ${{ steps.sync.outputs.badge_count }}
        run: |
          BRANCH="badges/sync-$(date -u +%Y%m%d-%H%M)"
          # Autoría del owner: la automatización es su herramienta, no un coautor
          git config user.name "F Colomer"
          git config user.email "colomr@pm.me"
          git checkout -b "$BRANCH"
          git add data/badges.json
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$COMMIT_MSG" \
            --reviewer colomr-cc \
            --body "Sincronización automática desde el perfil de Google Cloud Skills Boost ($BADGE_COUNT badge(s) nuevo(s)).

          Las descripciones las genera Gemini: revísalas en la preview de Firebase antes de mergear. Al mergear, deploy.yml publica a producción."
