name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    uses: maiwei-app/workflows/.github/workflows/ci-hugo.yml@main
    with:
      hugo-version: '0.164.0'

  quality:
    uses: maiwei-app/workflows/.github/workflows/ci-python.yml@main
    with:
      # The reusable defaults to requirements-ci.lock, which no longer exists.
      requirements-file: requirements-dev.txt
      coverage: true

  # Repo-specific: ci-python.yml's generic JSON check only validates
  # syntax for files outside its own fixed schema map (release-please,
  # commitlint, markdownlint). badges.schema.json is local to this repo.
  badges-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install --only-binary ':all:' -r requirements-dev.txt

      - name: Validate badges JSON against schema
        run: check-jsonschema --schemafile schemas/badges.schema.json data/badges.json data/anthropic_badges.json

  sonar:
    needs: [build, quality]
    uses: maiwei-app/workflows/.github/workflows/sonar-scan.yml@main
    with:
      project-key: maiwei-app_colomr.cc
      # Report uploaded by the quality job; without it Sonar reads new code
      # as 0% covered and the quality gate fails.
      coverage-artifact: coverage-xml
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
