name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sin atribución de IA (autoría del owner)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Autoría: los campos author/committer no pueden ser de una IA
          AUTHOR_PATTERN='claude|anthropic|copilot|\[bot\]'
          # Atribución: frases de cuño de IA en mensajes de commit, título o cuerpo del PR
          ATTRIB_PATTERN='co-authored-by:.*(claude|anthropic|copilot)|generated with|generated by|noreply@anthropic|🤖'
          FAIL=0
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "Revisando commits de $RANGE"
          if git log "$RANGE" --format='%an <%ae> / %cn <%ce>' | grep -inE "$AUTHOR_PATTERN"; then
            echo "::error::Autor o committer de IA detectado en los commits"
            FAIL=1
          fi
          if git log "$RANGE" --format='%B' | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::Atribución de IA detectada en mensajes de commit"
            FAIL=1
          fi
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::Atribución de IA detectada en el título o cuerpo del PR"
            FAIL=1
          fi
          exit $FAIL

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install --only-binary ':all:' --require-hashes -r requirements-ci.lock

      - name: Lint Python (ruff)
        run: ruff check scripts/ tests/

      - name: Validate JSON schemas
        run: check-jsonschema --schemafile schemas/badges.schema.json data/badges.json data/anthropic_badges.json

      - name: Unit tests (pytest)
        run: pytest tests/ -v
