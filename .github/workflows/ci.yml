name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install --only-binary ':all:' -r requirements-dev.txt -r scripts/requirements.txt

      - name: Lint Python (ruff)
        run: ruff check scripts/ tests/

      - name: Validate JSON schemas
        run: check-jsonschema --schemafile schemas/badges.schema.json data/badges.json data/anthropic_badges.json

      - name: Unit tests (pytest)
        run: pytest tests/ -v
