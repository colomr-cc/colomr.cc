name: Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # Manual trigger (branch selector included)

jobs:
  deploy:
    # Dependabot runs read from Dependabot's secret store, so
    # FIREBASE_SERVICE_ACCOUNT arrives empty and the deploy fails. Granting it
    # there would publish an identical preview — a dependency bump does not
    # change the rendered site — and hand the production key to runs triggered
    # by third-party updates. The Hugo build still runs as ci.yml's build job.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          # Pinned on purpose: with 'latest', CI can approve code that breaks
          # the local build. Update here and on the machines at the same time.
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        run: hugo --cleanDestinationDir

      # Push to main → deploy to production
      - name: Deploy to production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live

      # PR → deploy to a preview channel
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
